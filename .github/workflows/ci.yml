name: ci

on:
  push:
  pull_request:

jobs:
  schemas-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Validate Action pins resolve
        run: python -m tools.validate_action_pins

      - name: Validate schemas
        run: python -m tools.validate_schemas

      - name: Lint
        run: |
          ruff check src tests tools
          mypy

      - name: Test
        run: pytest -q

      - name: Project status evidence
        run: python -m tools.project_status
