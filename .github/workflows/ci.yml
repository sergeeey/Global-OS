name: ci

on:
  push:
  pull_request:

jobs:
  schemas-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gos
          POSTGRES_PASSWORD: gos
          POSTGRES_DB: global_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gos -d global_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GOS_TEST_DATABASE_URL: postgresql://gos:gos@127.0.0.1:5432/global_os
      GOS_REQUIRE_DOCKER: "1"
      GOS_REQUIRE_OTLP: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
      GOS_OTEL_TRACES_FILE: ${{ github.workspace }}/deploy/otel-out/traces.json
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Build Rust Authority Kernel
        run: |
          cargo test -p authority_kernel
          cargo build -p authority_kernel
          echo "$PWD/target/debug" >> "$GITHUB_PATH"

      - name: Start Temporal (dev)
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          export PATH="$HOME/.temporalio/bin:$PATH"
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"
          temporal server start-dev --ip 127.0.0.1 --port 7233 --headless > /tmp/temporal-dev.log 2>&1 &
          echo $! > /tmp/temporal-dev.pid
          for i in $(seq 1 60); do
            if temporal operator cluster health --address 127.0.0.1:7233; then
              echo "Temporal healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Temporal failed to become healthy"
          cat /tmp/temporal-dev.log || true
          exit 1

      - name: Pull sandbox image + start OTLP collector
        run: |
          docker pull python:3.13-slim
          mkdir -p deploy/otel-out
          chmod 777 deploy/otel-out
          # Prove containers actually run (not only docker info)
          docker run --rm --network=none python:3.13-slim python -c "print('docker-ok')"
          docker compose -f deploy/docker-compose.reality.yml up -d
          for i in $(seq 1 60); do
            if docker compose -f deploy/docker-compose.reality.yml ps --status running | grep -q otel-collector \
               && nc -z 127.0.0.1 4318; then
              echo "OTLP collector ready after ${i}s"
              exit 0
            fi
            # Surface crash loops early
            if docker compose -f deploy/docker-compose.reality.yml ps | grep -qi exit; then
              echo "collector exited"
              docker compose -f deploy/docker-compose.reality.yml logs || true
              exit 1
            fi
            sleep 1
          done
          docker compose -f deploy/docker-compose.reality.yml logs || true
          exit 1

      - name: Validate Action pins resolve
        run: python -m tools.validate_action_pins

      - name: Validate schemas
        run: python -m tools.validate_schemas

      - name: Lint
        run: |
          ruff check src tests tools
          mypy

      - name: Test
        env:
          TEMPORAL_ADDRESS: 127.0.0.1:7233
        run: pytest -q

      - name: Project status evidence
        run: python -m tools.project_status
