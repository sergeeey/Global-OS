name: ci

on:
  push:
  pull_request:

jobs:
  schemas-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gos
          POSTGRES_PASSWORD: gos
          POSTGRES_DB: global_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gos -d global_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GOS_TEST_DATABASE_URL: postgresql://gos:gos@127.0.0.1:5432/global_os
      GOS_REQUIRE_DOCKER: "1"
      GOS_REQUIRE_OTLP: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
      GOS_OTEL_TRACES_FILE: ${{ github.workspace }}/deploy/otel-out/traces.json
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" -c requirements-dev.lock

      - name: Build Rust Authority Kernel
        run: |
          cargo test -p authority_kernel
          cargo build -p authority_kernel
          echo "$PWD/target/debug" >> "$GITHUB_PATH"

      - name: Start Temporal (dev)
        run: |
          curl -sSf https://temporal.download/cli.sh | sh -s -- --version "${TEMPORAL_CLI_VERSION}"
          export PATH="$HOME/.temporalio/bin:$PATH"
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"
          temporal server start-dev --ip 127.0.0.1 --port 7233 --headless > /tmp/temporal-dev.log 2>&1 &
          echo $! > /tmp/temporal-dev.pid
          for i in $(seq 1 60); do
            if temporal operator cluster health --address 127.0.0.1:7233; then
              echo "Temporal healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Temporal failed to become healthy"
          cat /tmp/temporal-dev.log || true
          exit 1
        env:
          TEMPORAL_CLI_VERSION: "1.9.1"

      - name: Pull sandbox image + start OTLP collector
        run: |
          docker pull python:3.13-slim
          mkdir -p deploy/otel-out
          chmod 777 deploy/otel-out
          # Prove containers actually run (not only docker info)
          docker run --rm --network=none python:3.13-slim python -c "print('docker-ok')"
          docker compose -f deploy/docker-compose.reality.yml up -d
          for i in $(seq 1 60); do
            if docker compose -f deploy/docker-compose.reality.yml ps --status running | grep -q otel-collector \
               && nc -z 127.0.0.1 4318; then
              echo "OTLP collector ready after ${i}s"
              exit 0
            fi
            # Surface crash loops early
            if docker compose -f deploy/docker-compose.reality.yml ps | grep -qi exit; then
              echo "collector exited"
              docker compose -f deploy/docker-compose.reality.yml logs || true
              exit 1
            fi
            sleep 1
          done
          docker compose -f deploy/docker-compose.reality.yml logs || true
          exit 1

      - name: Validate Action pins resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m tools.validate_action_pins

      - name: Validate schemas
        run: python -m tools.validate_schemas

      - name: Lint
        run: |
          ruff check src tests tools
          mypy

      - name: Test
        env:
          TEMPORAL_ADDRESS: 127.0.0.1:7233
        run: pytest -q

      - name: Check standalone crash-probe coverage
        run: |
          probe="scripts/preprod_crash_window_recovery.py"
          if [ -f "$probe" ]; then
            echo "STANDALONE_PROBE_PRESENT"
            exit 0
          fi
          if [ "${GITHUB_BASE_REF:-}" = "cursor/verify-falsify-substrate-2907" ] || \
             [ "${GITHUB_HEAD_REF:-}" = "fix/crash-probe-authentic-r2" ] || \
             [ "${GITHUB_REF_NAME:-}" = "fix/crash-probe-authentic-r2" ]; then
            echo "::error::standalone crash probe missing on a branch where it is required"
            exit 1
          fi
          echo "EXPECTED_SKIP: standalone crash probe is not part of this branch"

      - name: Clear stale crash-window evidence
        if: ${{ hashFiles('scripts/preprod_crash_window_recovery.py') != '' }}
        run: |
          rm -f artifacts/preprod/final_acceptance/recovery/CRASH_WINDOW_RECOVERY.json

      - name: Standalone crash-window recovery probe
        if: ${{ hashFiles('scripts/preprod_crash_window_recovery.py') != '' }}
        timeout-minutes: 5
        run: |
          python scripts/preprod_crash_window_recovery.py

      - name: Verify crash-window evidence
        if: always() && hashFiles('scripts/preprod_crash_window_recovery.py') != ''
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          report = Path("artifacts/preprod/final_acceptance/recovery/CRASH_WINDOW_RECOVERY.json")
          if not report.is_file():
              print("::error::CRASH_WINDOW_EVIDENCE_MISSING")
              sys.exit(1)

          data = json.loads(report.read_text(encoding="utf-8"))
          required = {
              "ok": True,
              "pid_match": True,
              "killed_by_probe": True,
              "tool_executions_before_crash": 1,
              "tool_executions_after_resume": 0,
              "external_effects_total": 1,
              "write_receipt_count": 1,
              "observe_completed_before_kill": False,
              "terminal_status": "SUCCEEDED",
          }
          bad = {key: (data.get(key), expected) for key, expected in required.items() if data.get(key) != expected}
          if bad:
              print(f"::error::CRASH_WINDOW_EVIDENCE_INVALID {bad}")
              sys.exit(1)
          print("CRASH_WINDOW_EVIDENCE_OK")
          PY

      - name: Publish crash-window probe summary
        if: always() && hashFiles('scripts/preprod_crash_window_recovery.py') != ''
        run: |
          report="artifacts/preprod/final_acceptance/recovery/CRASH_WINDOW_RECOVERY.json"
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "crash-window report not found" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Project status evidence
        run: python -m tools.project_status
