# Reality Contact stack: OTLP collector.
#   docker compose -f deploy/docker-compose.reality.yml up -d
#   export OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318
#   export GOS_OTEL_TRACES_FILE=$PWD/deploy/otel-out/traces.json

services:
  otel-collector:
    image: otel/opentelemetry-collector:0.114.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    user: "0:0"
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - ./otel-out:/var/lib/otel
    ports:
      - "4317:4317"
      - "4318:4318"
